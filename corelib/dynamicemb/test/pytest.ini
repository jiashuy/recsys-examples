[pytest]
# Imported by path, so two test files may share a basename in different
# directories, and `pythonpath` makes `import common` work from every one.
addopts = --import-mode=importlib
pythonpath = .
testpaths = unit integration
python_files = test_*.py
markers =
    unit: tests one component in isolation (collected under unit/)
    integration: tests several components end to end (collected under integration/)
    fwd_bwd: CI group -- forward / backward / planner / optimizer correctness (the default)
    load_dump: CI group -- checkpoint and dump/load paths
